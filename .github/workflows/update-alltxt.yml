name: Update all.txt

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest txt
        run: |
          curl -L "https://bestcf.pages.dev/tiancheng2/all.txt" -o all.txt

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add all.txt

          git diff --cached --quiet || (
            git commit -m "Auto update all.txt"
            git push
          )
